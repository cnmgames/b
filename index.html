<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月色真美,风也温柔</title>
    <link rel="icon" type="image/x-icon" href="https://z1.ax1x.com/2023/10/01/pPLK9vn.jpg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #fff;
            overflow: hidden;
        }
        #particles-js {
            position: fixed;
            z-index: -1;
            width: 100%;
            height: 100vh;
            background-color: transparent;
        }
        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0px 3px 10px rgba(0, 0, 0, 0.2);
            padding: 20px;
            width: 80%;
            max-width: 400px;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 20px;
            background-image: url('https://z1.ax1x.com/2023/10/01/pPLK9vn.jpg');
            background-size: cover;
            animation: breathing 3s infinite ease-in-out;
        }
        @keyframes breathing {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .intro {
            font-size: 16px;
            margin-bottom: 20px;
        }
        .button {
            display: block;
            margin: 10px auto;
            padding: 10px 20px;
            background: linear-gradient(to right, #61c0bf, #7ae2d1);
            color: #fff;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }
        .button:hover {
            background: linear-gradient(to right, #7ae2d1, #61c0bf);
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <div class="container">
        <div class="avatar"></div>
        <div class="intro">
            <h1>情侣小游戏</h1>
            <p>公众号：小坤爱玩</p>
            <p>直奔主题,如果没及时回复请见谅!</p>
        </div>
        <a class="button" href="https://ttla.top/h5/index.html" target="_blank">飞行棋</a>
        <a class="button" href="https://ttla.top/h6/index.html" target="_blank">大冒险</a>
        <a class="button" href="https://ttla.top/h7/index.html" target="_blank">摇骰子</a>
        <a class="button" href="https://weidian.com/?userid=1388425837" target="_blank">获取识别码</a>
    </div>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS('particles-js', {
            particles: {
                number: {
                    value: 100,
                    density: {
                        enable: true,
                        value_area: 800
                    }
                },
                color: {
                    value: '#000000'
                },
                shape: {
                    type: 'circle',
                    stroke: {
                        width: 0,
                        color: '#000000'
                    },
                    polygon: {
                        nb_sides: 5
                    },
                    image: {
                        src: 'img/github.svg',
                        width: 100,
                        height: 100
                    }
                },
                opacity: {
                    value: 0.4,
                    random: true,
                    anim: {
                        enable: false,
                        speed: 1,
                        opacity_min: 0.1,
                        sync: false
                    }
                },
                size: {
                    value: 3,
                    random: true,
                    anim: {
                        enable: false,
                        speed: 40,
                        size_min: 0.1,
                        sync: false
                    }
                },
                line_linked: {
                    enable: false
                },
                move: {
                    enable: true,
                    speed: 2,
                    direction: 'none',
                    random: true,
                    straight: false,
                    out_mode: 'out',
                    bounce: false,
                    attract: {
                        enable: false,
                        rotateX: 600,
                        rotateY: 1200
                    }
                }
            },
            interactivity: {
                detect_on: 'canvas',
                events: {
                    onhover: {
                        enable: false
                    },
                    onclick: {
                        enable: false
                    },
                    resize: true
                },
                modes: {
                    grab: {
                        distance: 400,
                        line_linked: {
                            opacity: 1
                        }
                    },
                    bubble: {
                        distance: 400,
                        size: 40,
                        duration: 2,
                        opacity: 8,
                        speed: 3
                    },
                    repulse: {
                        distance: 200
                    },
                    push: {
                        particles_nb: 4
                    },
                    remove: {
                        particles_nb: 2
                    }
                }
            },
            retina_detect: true
        });
    </script>
<!-- 公告弹窗 -->
<style>
.notice-mask {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
}
.notice-wrap {
    width: 82%;
    max-width: 360px;
    background: #ffffff;
    border-radius: 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    overflow: hidden;
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
}
@keyframes popIn {
    0% {transform: scale(0.7) translateY(20px);opacity:0;}
    100% {transform: scale(1) translateY(0);opacity:1;}
}
.notice-badge {
    position: absolute;
    top: -1px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, #ff6b9d, #ff8e53);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 16px;
    border-radius: 0 0 12px 12px;
    letter-spacing: 1px;
    z-index: 2;
}
.notice-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 32px 20px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
}
.notice-header::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
    animation: shimmer 3s infinite;
}
@keyframes shimmer {
    0% {transform: rotate(0deg);}
    100% {transform: rotate(360deg);}
}
.notice-icon {
    font-size: 48px;
    display: block;
    margin-bottom: 8px;
    animation: bounce 2s infinite;
    position: relative;
    z-index: 1;
}
@keyframes bounce {
    0%, 100% {transform: translateY(0);}
    50% {transform: translateY(-8px);}
}
.notice-header h3 {
    margin: 0;
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
    position: relative;
    z-index: 1;
}
.notice-body {
    padding: 28px 24px 20px;
    text-align: center;
}
.notice-body p {
    margin: 0;
    font-size: 17px;
    color: #333;
    line-height: 1.8;
    font-weight: 500;
}
.notice-body .highlight {
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 700;
    font-size: 19px;
}
.notice-body .sub-text {
    margin-top: 10px;
    font-size: 13px;
    color: #999;
    font-weight: 400;
}
.notice-footer {
    padding: 0 24px 24px;
    display: flex;
    gap: 12px;
}
.notice-btn-primary {
    flex: 1;
    border: none;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    padding: 13px 20px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
}
.notice-btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
}
.notice-btn-primary:active {
    transform: translateY(0);
}
.notice-btn-secondary {
    border: none;
    background: #f0f0f0;
    color: #888;
    padding: 13px 18px;
    border-radius: 12px;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
}
.notice-btn-secondary:hover {
    background: #e5e5e5;
    color: #666;
}
</style>
<div class="notice-mask" id="popNotice">
    <div class="notice-wrap">
        <div class="notice-badge">NEW</div>
        <div class="notice-header">
            <span class="notice-icon">🎮</span>
            <h3>新版游戏已上线</h3>
        </div>
        <div class="notice-body">
            <p><span class="highlight">公测版</span> 现已开放体验</p>
            <p class="sub-text">更多玩法 · 更优体验 · 等你探索</p>
        </div>
        <div class="notice-footer">
            <button class="notice-btn-secondary" onclick="popNotice.style.display='none'">稍后</button>
            <button class="notice-btn-primary" onclick="window.open('https://love.ttla.top','_blank')">立即体验 →</button>
        </div>
    </div>
</div>
<!-- 公告弹窗结束 -->
</body>
</html>
